<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reader Test</title>
<style>
  :root {
    --bg: #111418; --panel: #1b2027; --line: #2b323c; --text: #e8ecf1; --dim: #8b95a3;
    --accent: #f2a33a; --ok: #4cc38a; --bad: #ef5d5d; --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 16px; display: grid; gap: 14px; }
  h1 { font-size: 20px; margin: 4px 0 0; letter-spacing: .02em; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .status { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 15px; }
  .status dt { color: var(--dim); }
  .status dd { margin: 0; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--dim); margin-right: 6px; }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); } .dot.wait { background: var(--accent); }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 14px; width: 100%;
           background: var(--accent); color: #1a1205; }
  button.secondary { background: transparent; color: var(--text); border: 1px solid var(--line); }
  button:disabled { opacity: .4; }
  .row { display: flex; gap: 10px; }
  .uid-label { color: var(--dim); font-size: 13px; text-transform: uppercase; letter-spacing: .08em; }
  .uid { font: 600 24px/1.3 var(--mono); word-break: break-all; margin: 6px 0 2px; min-height: 32px; }
  .serial { font: 14px var(--mono); color: var(--dim); word-break: break-all; }
  .hint { color: var(--dim); font-size: 14px; margin: 0; }
  label.toggle { display: flex; align-items: center; gap: 10px; font-size: 15px; margin-top: 10px; }
  input[type=text] { width: 100%; font: 16px var(--mono); padding: 12px; border-radius: 10px;
                     border: 1px solid var(--line); background: var(--bg); color: var(--text); }
  #log { font: 12px/1.5 var(--mono); white-space: pre-wrap; word-break: break-all; max-height: 40vh; overflow: auto;
         color: var(--dim); margin: 0; }
  #log .err { color: var(--bad); } #log .in { color: var(--ok); }
  .flash { animation: flash .6s ease-out; }
  @keyframes flash { from { background: #3a2c12; } to { background: var(--panel); } }
</style>
</head>
<body>
<main>
  <h1>ACR1555U Reader Test</h1>

  <section class="panel">
    <dl class="status">
      <dt>Reader</dt><dd id="st-reader"><span class="dot"></span>Not connected</dd>
      <dt>Card</dt><dd id="st-card"><span class="dot"></span>—</dd>
      <dt>Battery</dt><dd id="st-batt">—</dd>
    </dl>
    <div class="row" style="margin-top:14px">
      <button id="btn-connect">Connect reader</button>
      <button id="btn-disconnect" class="secondary" hidden>Disconnect</button>
    </div>
  </section>

  <section class="panel" id="uid-panel">
    <div class="uid-label">Last tag UID</div>
    <div class="uid" id="uid">—</div>
    <div class="serial" id="serial"></div>
    <label class="toggle"><input type="checkbox" id="auto" checked> Read UID automatically when a tag is placed</label>
    <div class="row" style="margin-top:12px">
      <button id="btn-read" class="secondary" disabled>Read now</button>
      <button id="btn-copy" class="secondary" disabled>Copy UID</button>
    </div>
  </section>

  <section class="panel">
    <div class="uid-label">Send APDU</div>
    <p class="hint" style="margin:6px 0 10px">Tag must be on the reader. FF CA 00 00 00 = UID, FF B0 00 04 10 = read NTAG page 4.</p>
    <input type="text" id="apdu" value="FF B0 00 04 10" autocomplete="off" spellcheck="false">
    <div class="row" style="margin-top:10px">
      <button id="btn-send" class="secondary" disabled>Send</button>
    </div>
  </section>

  <section class="panel">
    <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:8px">
      <div class="uid-label">Log</div>
      <button id="btn-clear" class="secondary" style="width:auto;padding:6px 12px;font-size:13px">Clear</button>
    </div>
    <pre id="log"></pre>
  </section>
</main>

<script type="module">
import { ACR1555U, hex, uidToSerial } from './acr1555u.js';

const $ = (id) => document.getElementById(id);
const logEl = $('log');
function log(msg, cls) {
  const t = new Date().toLocaleTimeString([], { hour12: false });
  const line = document.createElement('div');
  if (cls) line.className = cls;
  line.textContent = `${t}  ${msg}`;
  logEl.append(line);
  logEl.scrollTop = logEl.scrollHeight;
}
const setStatus = (id, state, text) => { $(id).innerHTML = `<span class="dot ${state}"></span>${text}`; };

const reader = new ACR1555U({ log: (m) => log(m) });
let busy = false;
let lastUid = null;

function setConnectedUI(on) {
  $('btn-connect').hidden = on;
  $('btn-disconnect').hidden = !on;
  for (const b of ['btn-read', 'btn-send']) $(b).disabled = !on;
}

async function readUid(source) {
  if (busy) return;
  busy = true;
  try {
    const { uid } = await reader.readUid();
    lastUid = uid;
    $('uid').textContent = hex(uid);
    $('serial').textContent = 'Web NFC format: ' + uidToSerial(uid);
    $('btn-copy').disabled = false;
    const p = $('uid-panel'); p.classList.remove('flash'); void p.offsetWidth; p.classList.add('flash');
    if (navigator.vibrate) navigator.vibrate(60);
    log(`UID ${hex(uid)} (${source})`, 'in');
  } catch (e) {
    log('Read failed: ' + e.message, 'err');
  } finally { busy = false; }
}

reader.addEventListener('ready', () => {
  setConnectedUI(true);
  setStatus('st-reader', 'ok', reader.device.name);
});
reader.addEventListener('disconnected', () => {
  setConnectedUI(false);
  setStatus('st-reader', 'bad', 'Disconnected');
  setStatus('st-card', '', '—');
});
reader.addEventListener('battery', () => { $('st-batt').textContent = reader.battery + '%'; });
reader.addEventListener('cardpresent', () => {
  setStatus('st-card', 'ok', 'Tag present');
  log('Tag placed');
  if ($('auto').checked) readUid('auto');
});
reader.addEventListener('cardremoved', () => { setStatus('st-card', '', 'No tag'); log('Tag removed'); });

$('btn-connect').addEventListener('click', async () => {
  setStatus('st-reader', 'wait', 'Connecting…');
  try {
    if (reader.device && !reader.connected) await reader.reconnect();
    else await reader.connect();
    if (!reader.cardPresent) setStatus('st-card', '', 'No tag');
  } catch (e) {
    setStatus('st-reader', 'bad', 'Not connected');
    if (e.name === 'NotFoundError') log('No reader chosen. Press its button so it advertises, then try again.', 'err');
    else log('Connect failed: ' + e.message, 'err');
    reader.disconnect();
  }
});
$('btn-disconnect').addEventListener('click', () => reader.disconnect());
$('btn-read').addEventListener('click', () => readUid('manual'));
$('btn-copy').addEventListener('click', async () => {
  if (!lastUid) return;
  try { await navigator.clipboard.writeText(hex(lastUid).replace(/ /g, '')); log('UID copied'); }
  catch { log('Copy failed', 'err'); }
});
$('btn-send').addEventListener('click', async () => {
  if (busy) return;
  busy = true;
  const cmd = $('apdu').value;
  try {
    await reader.powerOn();
    log('> ' + cmd.toUpperCase().trim());
    const r = await reader.transmit(cmd);
    log('< ' + hex(r), 'in');
  } catch (e) { log('Send failed: ' + e.message, 'err'); }
  finally { busy = false; }
});
$('btn-clear').addEventListener('click', () => { logEl.textContent = ''; });

if (!navigator.bluetooth) {
  log('Web Bluetooth is not available here. Open this page in Chrome on Android.', 'err');
  $('btn-connect').disabled = true;
}
</script>
</body>
</html>
