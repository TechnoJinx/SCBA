<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Safety Equipment Tracker</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<style>
  :root {
    --bg: #0f172a; --card: #1e293b; --card-border: #334155;
    --accent: #38bdf8; --text: #e2e8f0; --text-dim: #94a3b8;
    --danger: #f87171; --success: #4ade80;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 100px;
  }
  header { padding: 20px 16px 12px; text-align: center; }
  header h1 { font-size: 18px; margin: 0 0 4px; letter-spacing: 0.3px; }
  header p { margin: 2px 0 0; color: var(--text-dim); font-size: 12px; }
  .status-banner {
    margin: 12px 16px; padding: 10px 14px; border-radius: 10px; font-size: 13px;
    background: #422006; color: #fbbf24; border: 1px solid #78350f; display: none;
  }
  .status-banner.show { display: block; }
  .scan-area {
    margin: 16px; padding: 26px 16px; border-radius: 16px;
    background: var(--card); border: 1px solid var(--card-border); text-align: center;
  }
  .entry-buttons { display: flex; gap: 8px; }
  .entry-buttons button {
    flex: 1; border: none; border-radius: 999px; padding: 15px 8px;
    font-size: 14px; font-weight: 600; cursor: pointer; transition: transform 0.1s, background 0.2s;
  }
  .entry-buttons button:active { transform: scale(0.97); }
  #scanBarcodeEntryBtn { background: var(--accent); color: #052e3d; }
  #scanNfcEntryBtn { background: #fbbf24; color: #3a2c02; }
  #scanNfcEntryBtn.scanning { background: var(--danger); color: #3f0d0d; animation: pulse 1.4s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
  button:disabled { background: #475569 !important; color: #94a3b8 !important; cursor: not-allowed; }
  .scan-hint { margin-top: 12px; font-size: 12px; color: var(--text-dim); }
  .manual-link {
    display: block; margin-top: 10px; background: none; border: none; color: var(--accent);
    font-size: 12px; text-decoration: underline; cursor: pointer;
  }
  .toolbar { display: flex; gap: 8px; padding: 0 16px; margin-bottom: 8px; flex-wrap: wrap; }
  .toolbar input[type="text"], .toolbar select {
    flex: 1; min-width: 100px; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--card-border);
    background: var(--card); color: var(--text); font-size: 14px;
  }
  .section-label {
    padding: 0 16px; color: var(--text-dim); font-size: 12px;
    text-transform: uppercase; letter-spacing: 0.8px; margin: 18px 0 8px;
  }
  .item-list { padding: 0 16px; display: flex; flex-direction: column; gap: 8px; }
  .item-card {
    background: var(--card); border: 1px solid var(--card-border); border-radius: 12px;
    padding: 12px 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px;
  }
  .item-info { flex: 1; min-width: 0; }
  .item-name { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-meta { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .badges { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 600; }
  .badge-type { background: var(--accent); color: #052e3d; }
  .badge-unit { background: #334155; color: var(--text); }
  .badge-pass { background: var(--success); color: #062012; }
  .badge-fail { background: var(--danger); color: #3f0d0d; }
  .item-scanned { font-size: 11px; color: var(--text-dim); margin-top: 4px; }
  .item-actions { display: flex; gap: 6px; }
  .item-actions button {
    background: #0f172a; border: 1px solid var(--card-border); color: var(--text-dim);
    border-radius: 8px; padding: 6px 10px; font-size: 12px; cursor: pointer;
  }
  .empty-state { text-align: center; color: var(--text-dim); padding: 40px 20px; font-size: 14px; }
  .bottom-bar {
    position: fixed; bottom: 0; left: 0; right: 0; background: var(--card);
    border-top: 1px solid var(--card-border); padding: 10px 16px; display: flex; gap: 8px; justify-content: center;
  }
  .bottom-bar button {
    flex: 1; max-width: 200px; padding: 12px; border-radius: 10px; border: none;
    font-size: 13px; font-weight: 600; cursor: pointer;
  }
  #exportBtn { background: #334155; color: var(--text); }
  #clearBtn { background: #7f1d1d; color: #fecaca; }

  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none;
    align-items: flex-end; justify-content: center; z-index: 100;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--card); width: 100%; max-width: 480px; border-radius: 16px 16px 0 0;
    padding: 20px; max-height: 92vh; overflow-y: auto; animation: slideUp 0.2s ease-out;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal h2 { margin: 0 0 4px; font-size: 17px; }
  .modal .tag-id { font-family: monospace; color: var(--text-dim); font-size: 12px; margin-bottom: 16px; word-break: break-all; }
  .modal label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 4px; margin-top: 12px; }
  .modal input, .modal textarea, .modal select {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--card-border);
    background: #0f172a; color: var(--text); font-size: 14px;
  }
  .type-toggle { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
  .type-toggle button {
    flex: 1; min-width: 90px; padding: 10px; border-radius: 8px; border: 1px solid var(--card-border);
    background: #0f172a; color: var(--text-dim); font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .type-toggle button.active { background: var(--accent); color: #052e3d; border-color: var(--accent); }
  .field-row { display: flex; gap: 8px; }
  .field-row > div { flex: 1; }
  .type-fields { display: none; }
  .type-fields.active { display: block; }
  .modal-buttons { display: flex; gap: 8px; margin-top: 18px; }
  .modal-buttons button { flex: 1; padding: 12px; border-radius: 10px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; }
  #saveItemBtn { background: var(--accent); color: #052e3d; }
  #cancelModalBtn { background: #334155; color: var(--text); }
  #deleteItemBtn { background: #7f1d1d; color: #fecaca; flex: 0 0 auto; padding: 12px 16px; }

  .input-with-scan { display: flex; gap: 6px; align-items: stretch; }
  .input-with-scan input { flex: 1; }
  .scan-btn, .scan-nfc-btn, .write-nfc-btn, .scan-cam-btn, .write-date-btn {
    flex: 0 0 auto; width: 42px; border-radius: 8px; border: 1px solid var(--card-border);
    background: #0f172a; font-size: 18px; cursor: pointer; display: flex;
    align-items: center; justify-content: center;
  }
  .scan-btn { color: var(--accent); }
  .scan-cam-btn { color: #34d399; }
  .write-date-btn { color: #f472b6; }
  .scan-nfc-btn { color: #fbbf24; }
  .write-nfc-btn { color: #a78bfa; }
  .subsection-label {
    margin-top: 16px; padding-top: 10px; border-top: 1px dashed var(--card-border);
    font-size: 12px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px;
  }

  .view-row {
    display: flex; justify-content: space-between; gap: 12px; padding: 8px 0;
    border-bottom: 1px solid #263244; font-size: 14px;
  }
  .view-row .view-label { color: var(--text-dim); flex: 0 0 auto; }
  .view-row .view-value { color: var(--text); text-align: right; word-break: break-word; }

  .history-section { margin-top: 16px; border-top: 1px solid var(--card-border); padding-top: 12px; }
  .history-toggle { background: none; border: none; color: var(--accent); font-size: 13px; padding: 0; cursor: pointer; }
  .history-list { margin-top: 10px; max-height: 160px; overflow-y: auto; display: none; }
  .history-list.show { display: block; }
  .history-row {
    display: flex; justify-content: space-between; font-size: 12px; padding: 6px 0;
    border-bottom: 1px solid #263244; color: var(--text-dim);
  }
  .history-row .hist-loc { color: var(--text); }

  .toast {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%); background: var(--card);
    border: 1px solid var(--card-border); padding: 10px 18px; border-radius: 999px; font-size: 13px;
    z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.2s;
  }
  .toast.show { opacity: 1; }

  .scanner-overlay {
    position: fixed; inset: 0; background: #000; display: none;
    flex-direction: column; z-index: 300;
  }
  .scanner-overlay.show { display: flex; }
  .scanner-overlay video { flex: 1; width: 100%; object-fit: cover; }
  .scanner-hint {
    position: absolute; top: 16px; left: 0; right: 0; text-align: center;
    color: #fff; font-size: 14px; text-shadow: 0 1px 3px rgba(0,0,0,0.8); padding: 0 16px;
  }
  .scanner-frame {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 80%; max-width: 320px; height: 120px; border: 3px solid var(--accent);
    border-radius: 12px; box-shadow: 0 0 0 2000px rgba(0,0,0,0.4);
  }
  .scanner-cancel {
    padding: 16px; background: #000; border: none; color: #fff; font-size: 15px;
    font-weight: 600; cursor: pointer;
  }
</style>
</head>
<body>
<div class="scanner-overlay" id="scannerOverlay">
  <div class="scanner-hint" id="scannerHint">Point camera at the barcode</div>
  <video id="scannerVideo" autoplay playsinline muted></video>
  <div class="scanner-frame"></div>
  <button type="button" class="scanner-cancel" id="scannerCancelBtn">Cancel</button>
</div>

<header>
  <h1>🦺 Safety Equipment Tracker</h1>
  <p id="itemCount">0 items tracked</p>
</header>

<div class="status-banner" id="statusBanner"></div>

<div class="scan-area">
  <div class="entry-buttons">
    <button id="scanBarcodeEntryBtn">📷 Scan Barcode</button>
    <button id="scanNfcEntryBtn">📡 Scan NFC</button>
  </div>
  <div class="scan-hint" id="scanHint">Scan the collection point's barcode or RFID tag to find or add its record</div>
  <button type="button" class="manual-link" id="manualEntryLink">Can't scan? Enter an ID manually</button>
  <button type="button" class="manual-link" id="componentHistoryLink">📜 Look up a Frame/Cylinder/Mask's movement history</button>
  <button type="button" class="manual-link" id="addUnassignedLink">➕ Add equipment not at a location yet</button>
  <button type="button" class="manual-link" id="hardResetLink" style="color:#f87171;">⚠️ Reset app data & reload latest (use if updates aren't showing up)</button>
</div>

<div class="toolbar">
  <input type="text" id="searchInput" placeholder="Search...">
  <select id="typeFilter"><option value="">All types</option></select>
  <select id="unitFilter"><option value="">All units</option></select>
</div>

<div class="section-label">Inventory</div>
<div class="item-list" id="itemList"></div>

<div class="bottom-bar">
  <button id="exportBtn">Export CSV</button>
  <button id="clearBtn">Clear All</button>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">New Item</h2>
    <div class="tag-id" id="modalTagId"></div>

    <label>Equipment Type</label>
    <div class="type-toggle" id="typeToggle">
      <button type="button" data-type="Extinguisher">Extinguisher</button>
      <button type="button" data-type="Emergency Light">Emerg. Light</button>
      <button type="button" data-type="Eyewash Station">Eyewash</button>
      <button type="button" data-type="Spill Kit">Spill Kit</button>
      <button type="button" data-type="Mask Cabinet">Mask Cabinet</button>
      <button type="button" data-type="SAR">SAR</button>
      <button type="button" data-type="SCBA Station">SCBA Station</button>
      <button type="button" data-type="SCBA Cylinder">SCBA Cylinder</button>
      <button type="button" data-type="SCBA Frame">SCBA Frame</button>
      <button type="button" data-type="SCBA Mask">SCBA Mask</button>
    </div>

    <div id="unitFieldWrapper">
      <label>Unit</label>
      <select id="unitInput"></select>
    </div>

    <!-- Extinguisher fields -->
    <div class="type-fields" id="fields-Extinguisher">
      <label>Location</label>
      <input type="text" id="extLocationInput" placeholder="e.g. Reformer Shelter NE Door">
      <label>Weight & Agent</label>
      <input type="text" id="extWeightAgentInput" placeholder="e.g. 9.5 lbs CleanGuard">
      <label>General Inspection</label>
      <select id="extInspectionInput">
        <option value="">— Not set —</option><option value="Pass">Pass</option><option value="Fail">Fail</option><option value="N/A">N/A</option>
      </select>
      <label>Last Inspected</label>
      <input type="date" id="extLastInspectedInput">
      <label>Comments</label>
      <textarea id="extCommentsInput" rows="2"></textarea>
    </div>

    <!-- Emergency Light fields -->
    <div class="type-fields" id="fields-Emergency Light">
      <label>Location</label>
      <input type="text" id="lightLocationInput" placeholder="e.g. RE Shelter NE Dr">
      <label>General Inspection</label>
      <select id="lightInspectionInput">
        <option value="">— Not set —</option><option value="Pass">Pass</option><option value="Fail">Fail</option><option value="N/A">N/A</option>
      </select>
      <label>Last Inspected</label>
      <input type="date" id="lightLastInspectedInput">
      <label>Comments</label>
      <textarea id="lightCommentsInput" rows="2"></textarea>
    </div>

    <!-- Eyewash Station fields -->
    <div class="type-fields" id="fields-Eyewash Station">
      <label>Location</label>
      <input type="text" id="eyewashLocationInput" placeholder="e.g. NFH, Paint Booth">
      <label>General Inspection</label>
      <select id="eyewashInspectionInput">
        <option value="">— Not set —</option><option value="Pass">Pass</option><option value="Fail">Fail</option><option value="N/A">N/A</option>
      </select>
      <label>Last Service</label>
      <input type="date" id="eyewashLastServiceInput">
      <label>Last Inspected</label>
      <input type="date" id="eyewashLastInspectedInput">
      <label>Comments</label>
      <textarea id="eyewashCommentsInput" rows="2"></textarea>
    </div>

    <!-- Spill Kit fields -->
    <div class="type-fields" id="fields-Spill Kit">
      <label>Location</label>
      <input type="text" id="spillLocationInput" placeholder="e.g. NW corner Blaine parking lot">
      <label>Car Seal Intact</label>
      <select id="spillSealInput">
        <option value="">— Not set —</option><option value="Pass">Pass</option><option value="Fail">Fail</option><option value="N/A">N/A</option>
      </select>
      <label>Missing Items</label>
      <input type="text" id="spillMissingItemsInput" placeholder="e.g. none">
      <label>Box Condition</label>
      <input type="text" id="spillBoxConditionInput" placeholder="e.g. Good">
      <label>Last Inspected</label>
      <input type="date" id="spillLastInspectedInput">
      <label>Comments</label>
      <textarea id="spillCommentsInput" rows="2"></textarea>
    </div>

    <!-- Mask Cabinet (multiple masks stored together at a unit) -->
    <div class="type-fields" id="fields-Mask Cabinet">
      <label>Cabinet Location</label>
      <input type="text" id="maskCabLocationInput" placeholder="e.g. Main Control Room Mask Cabinet">
      <label>Cabinet Condition</label>
      <select id="maskCabConditionInput">
        <option value="">— Not set —</option><option value="Pass">Pass</option><option value="Fail">Fail</option><option value="N/A">N/A</option>
      </select>

      <label>L Mask RFID Tag</label>
      <div class="input-with-scan">
        <input type="text" id="maskCabLIdInput" placeholder="Tap 📡 to scan">
        <button type="button" class="scan-nfc-btn" data-target="maskCabLIdInput" data-date-target="maskCabLExpDateInput" title="Read tag">📡</button>
        <button type="button" class="scan-cam-btn" data-target="maskCabLIdInput" title="Scan barcode">📷</button>
        <button type="button" class="write-nfc-btn" data-target="maskCabLIdInput" data-date-target="maskCabLExpDateInput" title="Write ID to tag">✏️</button>
        <button type="button" class="write-date-btn" data-target="maskCabLIdInput" data-date-target="maskCabLExpDateInput" title="Update date only">📅</button>
      </div>
      <label>L Mask Calibration/EXP Date</label>
      <input type="date" id="maskCabLExpDateInput">

      <label>M Mask RFID Tag</label>
      <div class="input-with-scan">
        <input type="text" id="maskCabMIdInput" placeholder="Tap 📡 to scan">
        <button type="button" class="scan-nfc-btn" data-target="maskCabMIdInput" data-date-target="maskCabMExpDateInput" title="Read tag">📡</button>
        <button type="button" class="scan-cam-btn" data-target="maskCabMIdInput" title="Scan barcode">📷</button>
        <button type="button" class="write-nfc-btn" data-target="maskCabMIdInput" data-date-target="maskCabMExpDateInput" title="Write ID to tag">✏️</button>
        <button type="button" class="write-date-btn" data-target="maskCabMIdInput" data-date-target="maskCabMExpDateInput" title="Update date only">📅</button>
      </div>
      <label>M Mask Calibration/EXP Date</label>
      <input type="date" id="maskCabMExpDateInput">

      <label>S Mask RFID Tag</label>
      <div class="input-with-scan">
        <input type="text" id="maskCabSIdInput" placeholder="Tap 📡 to scan">
        <button type="button" class="scan-nfc-btn" data-target="maskCabSIdInput" data-date-target="maskCabSExpDateInput" title="Read tag">📡</button>
        <button type="button" class="scan-cam-btn" data-target="maskCabSIdInput" title="Scan barcode">📷</button>
        <button type="button" class="write-nfc-btn" data-target="maskCabSIdInput" data-date-target="maskCabSExpDateInput" title="Write ID to tag">✏️</button>
        <button type="button" class="write-date-btn" data-target="maskCabSIdInput" data-date-target="maskCabSExpDateInput" title="Update date only">📅</button>
      </div>
      <label>S Mask Calibration/EXP Date</label>
      <input type="date" id="maskCabSExpDateInput">

      <label>General Inspection</label>
      <select id="maskCabInspectionInput">
        <option value="">— Not set —</option><option value="Pass">Pass</option><option value="Fail">Fail</option><option value="N/A">N/A</option>
      </select>
      <label>Last Inspected</label>
      <input type="date" id="maskCabLastInspectedInput">
      <label>Comments</label>
      <textarea id="maskCabCommentsInput" rows="2"></textarea>
    </div>

    <!-- SAR (Supplied Air Regulator) -->
    <div class="type-fields" id="fields-SAR">
      <label>Location</label>
      <input type="text" id="sarLocationInput" placeholder="e.g. Main Control Room SAR Station">
      <label>Regulator Barcode/RFID</label>
      <div class="input-with-scan">
        <input type="text" id="sarIdInput" placeholder="Tap 📡 or 📷 to scan">
        <button type="button" class="scan-nfc-btn" data-target="sarIdInput" title="Read tag">📡</button>
        <button type="button" class="scan-cam-btn" data-target="sarIdInput" title="Scan barcode">📷</button>
        <button type="button" class="write-nfc-btn" data-target="sarIdInput" title="Write ID to tag">✏️</button>
      </div>
      <label>General Inspection</label>
      <select id="sarInspectionInput">
        <option value="">— Not set —</option><option value="Pass">Pass</option><option value="Fail">Fail</option><option value="N/A">N/A</option>
      </select>
      <label>Last Inspected</label>
      <input type="date" id="sarLastInspectedInput">
      <label>Comments</label>
      <textarea id="sarCommentsInput" rows="2"></textarea>
    </div>

    <!-- SCBA Station (combined) fields -->
    <div class="type-fields" id="fields-SCBA Station">
      <label>Cabinet Location</label>
      <input type="text" id="scbaCabinetLocationInput" placeholder="e.g. Reformer Shelter Inside #1">
      <label>Cabinet Condition</label>
      <select id="scbaCabinetConditionInput">
        <option value="">— Not set —</option><option value="Pass">Pass</option><option value="Fail">Fail</option><option value="N/A">N/A</option>
      </select>

      <div class="subsection-label">Frame</div>
      <label>Frame RFID Tag</label>
      <div class="input-with-scan">
        <input type="text" id="scbaFrameIdInput" placeholder="Tap 📡 to scan the frame's tag">
        <button type="button" class="scan-nfc-btn" data-target="scbaFrameIdInput" data-date-target="scbaLastCalibrationInput" title="Read tag">📡</button>
        <button type="button" class="scan-cam-btn" data-target="scbaFrameIdInput" title="Scan barcode">📷</button>
        <button type="button" class="write-nfc-btn" data-target="scbaFrameIdInput" data-date-target="scbaLastCalibrationInput" title="Write ID to tag">✏️</button>
        <button type="button" class="write-date-btn" data-target="scbaFrameIdInput" data-date-target="scbaLastCalibrationInput" title="Update date only">📅</button>
      </div>
      <label>Last Calibration</label>
      <input type="date" id="scbaLastCalibrationInput">

      <div class="subsection-label">Cylinder</div>
      <label>Cylinder RFID Tag</label>
      <div class="input-with-scan">
        <input type="text" id="scbaCylinderIdInput" placeholder="Tap 📡 to scan the cylinder's tag">
        <button type="button" class="scan-nfc-btn" data-target="scbaCylinderIdInput" data-date-target="scbaLastHydroInput" title="Read tag">📡</button>
        <button type="button" class="scan-cam-btn" data-target="scbaCylinderIdInput" title="Scan barcode">📷</button>
        <button type="button" class="write-nfc-btn" data-target="scbaCylinderIdInput" data-date-target="scbaLastHydroInput" title="Write ID to tag">✏️</button>
        <button type="button" class="write-date-btn" data-target="scbaCylinderIdInput" data-date-target="scbaLastHydroInput" title="Update date only">📅</button>
      </div>
      <div class="field-row">
        <div>
          <label>Last Hydro</label>
          <input type="date" id="scbaLastHydroInput">
        </div>
        <div>
          <label>Pressure (psi)</label>
          <input type="number" id="scbaPressureInput">
        </div>
      </div>

      <div class="subsection-label">Masks</div>
      <label>L Mask RFID Tag</label>
      <div class="input-with-scan">
        <input type="text" id="scbaLMaskIdInput" placeholder="Tap 📡 to scan">
        <button type="button" class="scan-nfc-btn" data-target="scbaLMaskIdInput" data-date-target="scbaLMaskExpDateInput" title="Read tag">📡</button>

<script>
const STORAGE_KEY = 'safety_tracker_items_v6';
const UNITS_KEY = 'safety_tracker_units_v1';
const ADD_NEW_VALUE = '__add_new__';
const DEFAULT_UNITS = ['Reformer', 'Hydrocracker', 'Calciner', 'Crude', 'Utilities', 'Blender', 'Coker', 'Shops', 'I&E', 'Buildings', 'Dock & Offsite', 'Barclay village', 'BRMs', 'Cars', 'Spares', 'North Fire Hall', 'West Fire Hall', 'South Fire Hall', 'Main Control Room', 'Safety Warehouse'];
const ALL_TYPES = ['Extinguisher', 'Emergency Light', 'Eyewash Station', 'Spill Kit', 'Mask Cabinet', 'SAR', 'SCBA Station', 'SCBA Cylinder', 'SCBA Frame', 'SCBA Mask'];

let items = {};
let units = [];
let currentId = null;
let currentType = 'Extinguisher';

// ---------- Storage ----------
function expandSeedData(compact) {
  const now = Date.now();
  const out = {};
  (compact.ext || []).forEach(([id, unit, extLocation, extWeightAgent, extInspection, extLastInspected, extComments]) => {
    out[id] = { type: 'Extinguisher', unit, extLocation, extWeightAgent, extInspection, extLastInspected, extComments,
      history: [{ location: extLocation, result: extInspection, timestamp: now }], createdAt: now, updatedAt: now };
  });
  (compact.light || []).forEach(([id, unit, lightLocation, lightInspection, lightLastInspected, lightComments]) => {
    out[id] = { type: 'Emergency Light', unit, lightLocation, lightInspection, lightLastInspected, lightComments,
      history: [{ location: lightLocation, result: lightInspection, timestamp: now }], createdAt: now, updatedAt: now };
  });
  (compact.scba || []).forEach(([id, unit, scbaCabinetLocation, scbaCabinetCondition, scbaFrameId, scbaLastCalibration,
      scbaCylinderId, scbaLastHydro, scbaPressure, scbaLMaskId, scbaMMaskId, scbaSMaskId, scbaInspection, scbaLastInspected, scbaComments]) => {
    out[id] = { type: 'SCBA Station', unit, scbaCabinetLocation, scbaCabinetCondition, scbaFrameId, scbaLastCalibration,
      scbaCylinderId, scbaLastHydro, scbaPressure, scbaLMaskId, scbaMMaskId, scbaSMaskId, scbaInspection, scbaLastInspected, scbaComments,
      history: [{ location: scbaCabinetLocation, result: scbaInspection, timestamp: now }], createdAt: now, updatedAt: now };
  });
  (compact.stdcyl || []).forEach(([id, unit, stdCylId, stdCylLastHydro, stdCylPressure, stdCylComments]) => {
    out[id] = { type: 'SCBA Cylinder', unit, stdCylId, stdCylLastHydro, stdCylPressure, stdCylComments,
      history: [{ location: stdCylId || id, result: '', timestamp: now }], createdAt: now, updatedAt: now };
  });
  (compact.eyewash || []).forEach(([id, eyewashLocation, eyewashInspection, eyewashLastService, eyewashLastInspected, eyewashComments]) => {
    out[id] = { type: 'Eyewash Station', unit: '', eyewashLocation, eyewashInspection, eyewashLastService, eyewashLastInspected, eyewashComments,
      history: [{ location: eyewashLocation, result: eyewashInspection, timestamp: now }], createdAt: now, updatedAt: now };
  });
  (compact.spillkit || []).forEach(([id, spillLocation, spillSeal, spillMissingItems, spillBoxCondition, spillLastInspected, spillComments]) => {
    out[id] = { type: 'Spill Kit', unit: '', spillLocation, spillSeal, spillMissingItems, spillBoxCondition, spillLastInspected, spillComments,
      history: [{ location: spillLocation, result: spillSeal, timestamp: now }], createdAt: now, updatedAt: now };
  });
  return out;
}

async function loadItems() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (raw !== null) {
    try { items = JSON.parse(raw); } catch (e) { items = {}; }
    return;
  }
  // First-ever load on this device — seed from the July 2026 inspection sheet.
  try {
    const res = await fetch('seed-data.json');
    if (!res.ok) throw new Error('seed-data.json returned HTTP ' + res.status);
    const json = await res.json();
    items = expandSeedData(json);
    Object.entries(items).forEach(([id, item]) => {
      recordComponentLinksForItem(item, id, item.updatedAt || Date.now());
    });
    saveComponentHistory();
  } catch (e) {
    items = {};
    showBanner('Could not load starting data: ' + (e && e.message ? e.message : e) + '. You can still use the app — scan/add items manually — or fix seed-data.json and clear site data to retry.');
  }
  saveItems();
}
function saveItems() { localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); }
const STALE_PLACEHOLDER_UNITS = ['Portables', 'Spill kits', 'Incident response equipment'];
function loadUnits() {
  try { const raw = localStorage.getItem(UNITS_KEY); units = raw ? JSON.parse(raw) : DEFAULT_UNITS.slice(); }
  catch (e) { units = DEFAULT_UNITS.slice(); }
  const before = units.length;
  units = units.filter(u => !STALE_PLACEHOLDER_UNITS.includes(u));
  if (units.length !== before) saveUnits();
}
function saveUnits() { localStorage.setItem(UNITS_KEY, JSON.stringify(units)); }
function ensureUnit(name) { if (name && !units.includes(name)) { units.push(name); saveUnits(); } }

// ---------- Component history (per-RFID-tag movement across collection points) ----------
const COMPONENT_HISTORY_KEY = 'safety_tracker_component_history_v1';
let componentHistory = {};
function loadComponentHistory() {
  try { const raw = localStorage.getItem(COMPONENT_HISTORY_KEY); componentHistory = raw ? JSON.parse(raw) : {}; }
  catch (e) { componentHistory = {}; }
}
function saveComponentHistory() { localStorage.setItem(COMPONENT_HISTORY_KEY, JSON.stringify(componentHistory)); }

function recordComponentLink(componentId, collectionPointId, role, timestamp) {
  if (!componentId) return;
  const key = String(componentId).trim();
  if (!key) return;
  if (!componentHistory[key]) componentHistory[key] = [];
  const entries = componentHistory[key];
  const last = entries[entries.length - 1];
  // Skip if this is exactly the same collection point + role as last time (nothing actually moved)
  if (last && last.collectionPointId === collectionPointId && last.role === role) return;
  entries.push({ collectionPointId, role, timestamp });
}

function recordComponentLinksForItem(item, collectionPointId, timestamp) {
  if (item.type === 'SCBA Station') {
    recordComponentLink(item.scbaFrameId, collectionPointId, 'Frame', timestamp);
    recordComponentLink(item.scbaCylinderId, collectionPointId, 'Cylinder', timestamp);
    recordComponentLink(item.scbaLMaskId, collectionPointId, 'L Mask', timestamp);
    recordComponentLink(item.scbaMMaskId, collectionPointId, 'M Mask', timestamp);
    recordComponentLink(item.scbaSMaskId, collectionPointId, 'S Mask', timestamp);
  } else if (item.type === 'SCBA Cylinder') {
    recordComponentLink(item.stdCylId, collectionPointId, 'Cylinder', timestamp);
  } else if (item.type === 'SCBA Frame') {
    recordComponentLink(item.stdFrameId, collectionPointId, 'Frame', timestamp);
  } else if (item.type === 'SCBA Mask') {
    recordComponentLink(item.stdMaskId, collectionPointId, (item.stdMaskSize || '') + ' Mask', timestamp);
  } else if (item.type === 'Mask Cabinet') {
    recordComponentLink(item.maskCabLId, collectionPointId, 'L Mask', timestamp);
    recordComponentLink(item.maskCabMId, collectionPointId, 'M Mask', timestamp);
    recordComponentLink(item.maskCabSId, collectionPointId, 'S Mask', timestamp);
  }
}

// ---------- UI helpers ----------
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
function showBanner(msg) {
  const b = document.getElementById('statusBanner');
  b.textContent = msg; b.classList.add('show');
}
function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : str;
  return div.innerHTML;
}
function escapeAttr(str) { return String(str).replace(/"/g, '&quot;'); }
function timeAgo(ts) {
  const diff = Date.now() - ts;
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return mins + 'm ago';
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return hrs + 'h ago';
  const days = Math.floor(hrs / 24);
  if (days < 30) return days + 'd ago';
  return new Date(ts).toLocaleDateString();
}
function itemDisplayName(item, id) {
  if (item.type === 'Extinguisher') return item.extLocation || id;
  if (item.type === 'Emergency Light') return item.lightLocation || id;
  if (item.type === 'Eyewash Station') return item.eyewashLocation || id;
  if (item.type === 'Spill Kit') return item.spillLocation || id;
  if (item.type === 'Mask Cabinet') return item.maskCabLocation || id;
  if (item.type === 'SAR') return item.sarLocation || id;
  if (item.type === 'SCBA Station') return item.scbaCabinetLocation || id;
  if (item.type === 'SCBA Cylinder') return item.stdCylId || id;
  if (item.type === 'SCBA Frame') return item.stdFrameId || id;
  if (item.type === 'SCBA Mask') return (item.stdMaskSize ? item.stdMaskSize + ' Mask ' : 'Mask ') + (item.stdMaskId || id);
  return id;
}
function itemInspectionResult(item) {
  if (item.type === 'Extinguisher') return item.extInspection || '';
  if (item.type === 'Emergency Light') return item.lightInspection || '';
  if (item.type === 'Eyewash Station') return item.eyewashInspection || '';
  if (item.type === 'Spill Kit') return item.spillSeal || '';
  if (item.type === 'Mask Cabinet') return item.maskCabInspection || '';
  if (item.type === 'SAR') return item.sarInspection || '';
  if (item.type === 'SCBA Station') return item.scbaInspection || '';
  return '';
}
function itemSummaryLine(item) {
  if (item.type === 'Extinguisher') {
    const p = []; if (item.extWeightAgent) p.push(item.extWeightAgent); if (item.extLastInspected) p.push('Inspected ' + item.extLastInspected);
    return p.join(' · ');
  }
  if (item.type === 'Emergency Light') {
    const p = []; if (item.lightLastInspected) p.push('Inspected ' + item.lightLastInspected);
    return p.join(' · ');
  }
  if (item.type === 'Eyewash Station') {
    const p = []; if (item.eyewashLastService) p.push('Serviced ' + item.eyewashLastService); if (item.eyewashLastInspected) p.push('Inspected ' + item.eyewashLastInspected);
    return p.join(' · ');
  }
  if (item.type === 'Spill Kit') {
    const p = []; if (item.spillBoxCondition) p.push(item.spillBoxCondition); if (item.spillMissingItems && item.spillMissingItems.toLowerCase() !== 'none') p.push('Missing: ' + item.spillMissingItems);
    return p.join(' · ');
  }
  if (item.type === 'Mask Cabinet') {
    const p = [];
    const maskCount = [item.maskCabLId, item.maskCabMId, item.maskCabSId].filter(Boolean).length;
    if (maskCount) p.push(maskCount + ' mask' + (maskCount === 1 ? '' : 's') + ' linked');
    if (item.maskCabLastInspected) p.push('Inspected ' + item.maskCabLastInspected);
    return p.join(' · ');
  }
  if (item.type === 'SAR') {
    const p = []; if (item.sarId) p.push(item.sarId); if (item.sarLastInspected) p.push('Inspected ' + item.sarLastInspected);
    return p.join(' · ');
  }
  if (item.type === 'SCBA Station') {
    const p = [];
    if (item.scbaFrameId) p.push('Frame linked');
    if (item.scbaCylinderId) p.push('Cyl linked');
    const maskCount = [item.scbaLMaskId, item.scbaMMaskId, item.scbaSMaskId].filter(Boolean).length;
    if (maskCount) p.push(maskCount + ' mask' + (maskCount === 1 ? '' : 's') + ' linked');
    if (item.scbaLastInspected) p.push('Inspected ' + item.scbaLastInspected);
    return p.join(' · ');
  }
  if (item.type === 'SCBA Cylinder') {
    const p = []; if (item.stdCylLastHydro) p.push('Hydro ' + item.stdCylLastHydro); if (item.stdCylPressure) p.push(item.stdCylPressure + ' psi');
    return p.join(' · ');
  }
  if (item.type === 'SCBA Frame') {
    const p = []; if (item.stdFrameLastCalibration) p.push('Cal ' + item.stdFrameLastCalibration);
    return p.join(' · ');
  }
  if (item.type === 'SCBA Mask') {
    const p = []; if (item.stdMaskExpDate) p.push('Exp ' + item.stdMaskExpDate);
    return p.join(' · ');
  }
  return '';
}

function populateFilters() {
  const typeSel = document.getElementById('typeFilter');
  const curType = typeSel.value;
  typeSel.innerHTML = '<option value="">All types</option>' +
    ALL_TYPES.map(t => `<option value="${escapeAttr(t)}">${escapeHtml(t)}</option>`).join('');
  typeSel.value = ALL_TYPES.includes(curType) ? curType : '';

  const unitSel = document.getElementById('unitFilter');
  const curUnit = unitSel.value;
  unitSel.innerHTML = '<option value="">All units</option>' +
    units.map(u => `<option value="${escapeAttr(u)}">${escapeHtml(u)}</option>`).join('');
  unitSel.value = units.includes(curUnit) ? curUnit : '';
}

function findMatchingId(value) {
  if (items[value]) return value;
  const v = String(value).trim().toLowerCase();
  if (!v) return null;
  for (const [id, item] of Object.entries(items)) {
    if (item.type === 'SCBA Station') {
      if ([item.scbaFrameId, item.scbaCylinderId, item.scbaLMaskId, item.scbaMMaskId, item.scbaSMaskId]
        .some(f => f && String(f).trim().toLowerCase() === v)) {
        return id;
      }
    } else if (item.type === 'Mask Cabinet') {
      if ([item.maskCabLId, item.maskCabMId, item.maskCabSId]
        .some(f => f && String(f).trim().toLowerCase() === v)) {
        return id;
      }
    }
  }
  return null;
}

function itemSearchHay(item, id) {
  const parts = [itemDisplayName(item, id), item.type, item.unit, id];
  if (item.type === 'SCBA Station') {
    parts.push(item.scbaFrameId, item.scbaCylinderId, item.scbaLMaskId, item.scbaMMaskId, item.scbaSMaskId);
  } else if (item.type === 'Mask Cabinet') {
    parts.push(item.maskCabLId, item.maskCabMId, item.maskCabSId);
  }
  return parts.filter(Boolean).join(' ').toLowerCase();
}

function renderList() {
  const listEl = document.getElementById('itemList');
  const query = document.getElementById('searchInput').value.trim().toLowerCase();
  const typeFilterVal = document.getElementById('typeFilter').value;
  const unitFilterVal = document.getElementById('unitFilter').value;
  const entries = Object.entries(items).filter(([id, item]) => {
    if (typeFilterVal && item.type !== typeFilterVal) return false;
    if (unitFilterVal && item.unit !== unitFilterVal) return false;
    if (!query) return true;
    const hay = itemSearchHay(item, id);
    return hay.includes(query);
  }).sort((a, b) => (b[1].updatedAt || 0) - (a[1].updatedAt || 0));

  document.getElementById('itemCount').textContent =
    Object.keys(items).length + ' item' + (Object.keys(items).length === 1 ? '' : 's') + ' tracked';

  if (entries.length === 0) {
    listEl.innerHTML = '<div class="empty-state">No items yet — scan a collection point barcode to add one.</div>';
    return;
  }

  listEl.innerHTML = entries.map(([id, item]) => {
    const result = itemInspectionResult(item);
    const resultBadge = result === 'Pass' ? '<span class="badge badge-pass">Pass</span>'
      : result === 'Fail' ? '<span class="badge badge-fail">Fail</span>' : '';
    return `
    <div class="item-card" data-id="${escapeAttr(id)}">
      <div class="item-info">
        <div class="item-name">${escapeHtml(itemDisplayName(item, id))}</div>
        <div class="item-meta">${escapeHtml(itemSummaryLine(item))}</div>
        <div class="badges">

function populateUnitSelect(selected) {
  const sel = document.getElementById('unitInput');

    opt.value = u; opt.textContent = u;

let scannerStream = null;
let scannerRAF = null;
let scannerMode = 'entry'; // 'entry' = find/create a collection point, 'field' = fill one input
let scannerTargetId = null;
let barcodeDetector = null;
if ('BarcodeDetector' in window) {
  try {
    barcodeDetector = new BarcodeDetector({
      formats: ['code_128', 'code_39', 'ean_13', 'ean_8', 'upc_a', 'upc_e', 'qr_code', 'data_matrix', 'itf']
    });
  } catch (e) { barcodeDetector = null; }
}

async function openScanner(opts) {
  opts = opts || {};
  scannerMode = opts.targetId ? 'field' : 'entry';
  scannerTargetId = opts.targetId || null;

  if (!barcodeDetector) {
    showToast('Camera barcode scanning isn\'t supported in this browser');
    if (scannerMode === 'entry') {
      const val = prompt('Enter the collection point barcode manually:');
      const trimmed = (val || '').trim();
      if (trimmed) openModal(trimmed);
    } else {
      const val = prompt('Enter the barcode manually:');
      const trimmed = (val || '').trim();
      if (trimmed) {
        const input = document.getElementById(scannerTargetId);
        if (input) input.value = trimmed;
        if (scannerTargetId === 'historyLookupInput') renderComponentHistory(trimmed);
      }
    }
    return;
  }
  const overlay = document.getElementById('scannerOverlay');
  const video = document.getElementById('scannerVideo');
  const hint = document.getElementById('scannerHint');
  hint.textContent = 'Point camera at the barcode';
  overlay.classList.add('show');

  try {
    scannerStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    video.srcObject = scannerStream;
    await video.play();
    scanLoop();
  } catch (err) {
    hint.textContent = 'Camera access failed: ' + (err && err.message ? err.message : 'unknown error');
  }
}

function scanLoop() {
  const video = document.getElementById('scannerVideo');
  if (!scannerStream) return;
  barcodeDetector.detect(video).then((codes) => {
    if (codes && codes.length > 0 && codes[0].rawValue) {
      const value = codes[0].rawValue;
      if (navigator.vibrate) navigator.vibrate(60);
      const wasFieldMode = scannerMode === 'field';
      const targetId = scannerTargetId;
      closeScanner();
      if (wasFieldMode && targetId) {
        const input = document.getElementById(targetId);
        if (input) input.value = value;
        showToast('Scanned: ' + value);
        if (targetId === 'historyLookupInput') renderComponentHistory(value);
        return;
      }
      const matchId = findMatchingId(value);
      if (matchId && matchId !== value) {
        showToast('Found on: ' + itemDisplayName(items[matchId], matchId));
        openComponentHistoryFor(value);
        return;
      }
      showToast('Barcode: ' + value);
      openModal(matchId || value);
      return;
    }
    scannerRAF = requestAnimationFrame(scanLoop);
  }).catch(() => {
    scannerRAF = requestAnimationFrame(scanLoop);
  });
}

function closeScanner() {
  if (scannerRAF) { cancelAnimationFrame(scannerRAF); scannerRAF = null; }
  if (scannerStream) { scannerStream.getTracks().forEach(t => t.stop()); scannerStream = null; }
  document.getElementById('scannerOverlay').classList.remove('show');
  scannerMode = 'entry';
  scannerTargetId = null;
}

document.getElementById('scannerCancelBtn').addEventListener('click', closeScanner);
document.getElementById('scanBarcodeEntryBtn').addEventListener('click', () => openScanner());
document.addEventListener('click', (e) => {
  const camBtn = e.target.closest('.scan-cam-btn');
  if (camBtn) openScanner({ targetId: camBtn.dataset.target });
});
document.getElementById('manualEntryLink').addEventListener('click', () => {
  const val = prompt('Enter the collection point barcode or NFC ID manually:');
  const trimmed = (val || '').trim();
  if (trimmed) openModal(trimmed);
});

document.getElementById('addUnassignedLink').addEventListener('click', () => {
  const id = 'UNASSIGNED-' + Date.now().toString(36).toUpperCase();
  openModal(id);
});

document.getElementById('hardResetLink').addEventListener('click', async () => {
  const confirmed = confirm(
    'This deletes ALL data stored in this app on THIS device (including anything you\'ve scanned/entered), ' +
    'unregisters the offline cache, and reloads fresh from GitHub. This cannot be undone. Continue?'
  );
  if (!confirmed) return;
  try {
    localStorage.clear();
    if ('caches' in window) {
      const names = await caches.keys();
      await Promise.all(names.map(n => caches.delete(n)));
    }
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
  } catch (e) {
    alert('Reset ran into an issue: ' + (e && e.message ? e.message : e) + ' — try reloading manually.');
  }
  location.reload(true);
});

// ---------- Component movement history lookup ----------
function renderComponentHistory(componentId) {
  const resultsEl = document.getElementById('historyLookupResults');
  const key = String(componentId).trim();
  const entries = componentHistory[key];
  if (!key) { resultsEl.innerHTML = ''; return; }
  if (!entries || !entries.length) {
    resultsEl.innerHTML = '<div class="empty-state" style="padding:16px 0;">No recorded history for "' + escapeHtml(key) + '"</div>';
    return;
  }
  resultsEl.innerHTML = entries.slice().reverse().map(e => {
    const cp = items[e.collectionPointId];
    const cpName = cp ? itemDisplayName(cp, e.collectionPointId) : e.collectionPointId;
    const cpUnit = cp ? cp.unit : '';
    return `
      <div class="history-row view-history-row" data-cp-id="${escapeAttr(e.collectionPointId)}" style="flex-direction:column;align-items:flex-start;gap:2px;cursor:${cp ? 'pointer' : 'default'};">
        <div style="display:flex;justify-content:space-between;width:100%;">
          <span class="hist-loc">${escapeHtml(e.role)} at ${escapeHtml(cpName)}</span>
          <span>${new Date(e.timestamp).toLocaleDateString()}</span>
        </div>
        ${cpUnit ? `<div style="font-size:11px;color:var(--text-dim);">${escapeHtml(cpUnit)}</div>` : ''}
        ${cp ? '<div style="font-size:11px;color:var(--accent);">Tap to view this collection point →</div>' : ''}
      </div>
    `;
  }).join('');
}
document.getElementById('historyLookupInput').addEventListener('input', (e) => {
  renderComponentHistory(e.target.value);
});
document.getElementById('historyLookupResults').addEventListener('click', (e) => {
  const row = e.target.closest('.view-history-row');
  if (!row) return;
  const cpId = row.dataset.cpId;
  if (!items[cpId]) return;
  document.getElementById('historyLookupOverlay').classList.remove('show');
  openView(cpId);
});
function openComponentHistoryFor(value) {
  document.getElementById('historyLookupInput').value = value;
  document.getElementById('historyLookupOverlay').classList.add('show');
  renderComponentHistory(value);
}
document.getElementById('componentHistoryLink').addEventListener('click', () => {
  document.getElementById('historyLookupInput').value = '';
  document.getElementById('historyLookupResults').innerHTML = '';
  document.getElementById('historyLookupOverlay').classList.add('show');
});
document.getElementById('historyLookupCloseBtn').addEventListener('click', () => {
  document.getElementById('historyLookupOverlay').classList.remove('show');
});
document.getElementById('historyLookupOverlay').addEventListener('click', (e) => {
  if (e.target.id === 'historyLookupOverlay') document.getElementById('historyLookupOverlay').classList.remove('show');
});
document.getElementById('historyLookupNfcBtn').addEventListener('click', () => {
  scanNfcIntoField('historyLookupInput');
});

// ---------- NFC entry (alternate way to find/add a collection point) ----------
const scanNfcEntryBtn = document.getElementById('scanNfcEntryBtn');
let nfcEntryScanning = false;

async function startNfcEntryScanning() {
  if (!('NDEFReader' in window)) {
    showToast('NFC isn\'t available in this browser — use Scan Barcode instead');
    return;
  }
  nfcEntryScanning = true;
  scanNfcEntryBtn.textContent = 'Scanning… (tap to stop)';
  scanNfcEntryBtn.classList.add('scanning');
  showToast('Hold the collection point\'s tag to the back of your phone…');

  try {
    const reader = new NDEFReader();
    await reader.scan();
    reader.addEventListener('reading', (event) => {
      if (!nfcEntryScanning) return;
      const writtenId = readTextRecord(event.message);
      const value = writtenId || event.serialNumber;
      if (!value) { showToast('Tag has no readable ID'); return; }
      if (navigator.vibrate) navigator.vibrate(80);
      stopNfcEntryScanning();
      const matchId = findMatchingId(value);
      if (matchId && matchId !== value) {
        showToast('Found on: ' + itemDisplayName(items[matchId], matchId));
        openComponentHistoryFor(value);
        return;
      }
      showToast((writtenId ? 'Inventory ID: ' : 'NFC serial: ') + value);
      openModal(matchId || value);
    });
  } catch (err) {
    showToast('NFC scan failed: ' + (err && err.message ? err.message : 'unknown error'));
    stopNfcEntryScanning();
  }
}
function stopNfcEntryScanning() {
  nfcEntryScanning = false;
  scanNfcEntryBtn.textContent = '📡 Scan NFC';
  scanNfcEntryBtn.classList.remove('scanning');
}
scanNfcEntryBtn.addEventListener('click', () => {
  nfcEntryScanning ? stopNfcEntryScanning() : startNfcEntryScanning();
});

// ---------- NFC field-fill (links each RFID-tagged component: frame, cylinder, masks) ----------
document.addEventListener('click', (e) => {
  const readBtn = e.target.closest('.scan-nfc-btn');
  if (readBtn) scanNfcIntoField(readBtn.dataset.target, readBtn.dataset.dateTarget || null);
  const writeBtn = e.target.closest('.write-nfc-btn');
  if (writeBtn) writeNfcIdToTag(writeBtn.dataset.target, writeBtn.dataset.dateTarget || null);
  const dateBtn = e.target.closest('.write-date-btn');
  if (dateBtn) writeDateOnlyToTag(dateBtn.dataset.target, dateBtn.dataset.dateTarget);
});

function readTextRecords(message) {
  // Returns every decoded text record on the tag, in order. First is the ID, second (if present) is a companion date.
  if (!message || !message.records) return [];
  const out = [];
  for (const record of message.records) {
    if (record.recordType === 'text') {
      try {
        const decoder = new TextDecoder(record.encoding || 'utf-8');
        const text = decoder.decode(record.data).trim();
        if (text) out.push(text);
      } catch (e) { /* ignore malformed record */ }
    }
  }
  return out;
}
function readTextRecord(message) {
  const all = readTextRecords(message);
  return all.length ? all[0] : null;
}
function isIsoDate(s) { return /^\d{4}-\d{2}-\d{2}$/.test(s); }

async function scanNfcIntoField(targetInputId, dateTargetId) {
  if (!('NDEFReader' in window)) {
    showToast('NFC isn\'t available in this browser — enter it manually');
    return;
  }
  showToast('Hold the tag to the back of your phone…');
  let done = false;
  const timeoutId = setTimeout(() => {
    if (!done) { done = true; showToast('NFC scan timed out — try again'); }
  }, 10000);
  try {
    const reader = new NDEFReader();
    await reader.scan();
    reader.addEventListener('reading', (event) => {
      if (done) return;
      done = true;
      clearTimeout(timeoutId);
      const textRecords = readTextRecords(event.message);
      const writtenId = textRecords[0] || null;
      const writtenDate = textRecords[1] && isIsoDate(textRecords[1]) ? textRecords[1] : null;
      const value = writtenId || event.serialNumber;
      if (!value) { showToast('Tag has no readable ID'); return; }
      if (navigator.vibrate) navigator.vibrate(60);
      const input = document.getElementById(targetInputId);
      if (input) input.value = value;
      if (dateTargetId && writtenDate) {
        const dateInput = document.getElementById(dateTargetId);
        if (dateInput) dateInput.value = writtenDate;
      }
      showToast((writtenId ? 'Inventory ID: ' : 'NFC serial: ') + value + (writtenDate ? ' · Date: ' + writtenDate : ''));
      if (targetInputId === 'historyLookupInput') renderComponentHistory(value);
    });
  } catch (err) {
    clearTimeout(timeoutId);
    showToast('NFC scan failed: ' + (err && err.message ? err.message : 'unknown error'));
  }
}

async function writeNfcIdToTag(targetInputId, dateTargetId) {
  if (!('NDEFReader' in window)) {
    showToast('NFC isn\'t available in this browser');
    return;
  }
  const input = document.getElementById(targetInputId);
  const current = input ? input.value : '';
  const idValue = prompt('Inventory ID to write onto the tag:', current || '');
  const trimmed = (idValue || '').trim();
  if (!trimmed) return;

  let dateValue = '';
  if (dateTargetId) {
    const dateInput = document.getElementById(dateTargetId);
    const currentDate = dateInput ? dateInput.value : '';
    const entered = prompt('Calibration/hydro date to write onto the tag (YYYY-MM-DD), leave blank to skip:', currentDate || '');
    const trimmedDate = (entered || '').trim();
    if (trimmedDate && isIsoDate(trimmedDate)) dateValue = trimmedDate;
    else if (trimmedDate) showToast('Date not in YYYY-MM-DD format — skipping date, writing ID only');
  }

  showToast('Hold the blank/existing tag to the back of your phone to write…');
  let done = false;
  const timeoutId = setTimeout(() => {
    if (!done) { done = true; showToast('Write timed out — try again, holding the tag steady'); }
  }, 10000);
  try {
    const records = [{ recordType: 'text', data: trimmed }];
    if (dateValue) records.push({ recordType: 'text', data: dateValue });
    const writer = new NDEFReader();
    await writer.write({ records });
    done = true;
    clearTimeout(timeoutId);
    if (navigator.vibrate) navigator.vibrate([40, 40, 40]);
    if (input) input.value = trimmed;
    if (dateValue && dateTargetId) {
      const dateInput = document.getElementById(dateTargetId);
      if (dateInput) dateInput.value = dateValue;
    }
    showToast('Wrote "' + trimmed + '"' + (dateValue ? ' + date ' + dateValue : '') + ' to tag');
  } catch (err) {
    clearTimeout(timeoutId);
    if (!done) {
      done = true;
      showToast('Write failed: ' + (err && err.message ? err.message : 'unknown error'));
    }
  }
}

async function writeDateOnlyToTag(targetInputId, dateTargetId) {
  if (!('NDEFReader' in window)) {
    showToast('NFC isn\'t available in this browser');
    return;
  }
  const input = document.getElementById(targetInputId);
  const currentId = input ? input.value.trim() : '';
  if (!currentId) {
    showToast('No ID linked here yet — use the ✏️ button first to write an ID + date together');
    return;
  }
  const dateInput = document.getElementById(dateTargetId);
  const currentDate = dateInput ? dateInput.value : '';
  const entered = prompt('New date to write onto the tag (YYYY-MM-DD), keeping ID "' + currentId + '":', currentDate || '');
  const trimmedDate = (entered || '').trim();
  if (!trimmedDate) return;
  if (!isIsoDate(trimmedDate)) { showToast('Date must be in YYYY-MM-DD format'); return; }

  showToast('Hold the tag to the back of your phone to update the date…');
  let done = false;
  const timeoutId = setTimeout(() => {
    if (!done) { done = true; showToast('Write timed out — try again, holding the tag steady'); }
  }, 10000);
  try {
    const writer = new NDEFReader();
    await writer.write({ records: [{ recordType: 'text', data: currentId }, { recordType: 'text', data: trimmedDate }] });
    done = true;
    clearTimeout(timeoutId);
    if (navigator.vibrate) navigator.vibrate([40, 40, 40]);
    if (dateInput) dateInput.value = trimmedDate;
    showToast('Updated date to ' + trimmedDate + ' (ID "' + currentId + '" unchanged)');
  } catch (err) {
    clearTimeout(timeoutId);
    if (!done) {
      done = true;
      showToast('Write failed: ' + (err && err.message ? err.message : 'unknown error'));
    }
  }
}

// ---------- Init ----------
if (!window.isSecureContext) {
  showBanner('This page must be served over HTTPS (or localhost) for NFC/camera to work.');
}
(async function init() {
  loadUnits();
  loadComponentHistory();
  await loadItems();
  populateFilters();
  renderList();
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
